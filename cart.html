<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#326146"><title>Корзина — ТМВ маркет</title><link rel="stylesheet" href="styles.css"></head><body data-page="cart"><div id="site-header"></div><div class="site-layout"><aside class="site-catalog" id="site-catalog"></aside><main id="page-content"></main></div><dialog id="checkout-dialog"><div class="dialog-head"><h2>Оформление заказа</h2><button class="dialog-close" type="button" onclick="this.closest('dialog').close()" aria-label="Закрыть">×</button></div><form class="dialog-body" id="checkout-form"><label>Имя<br><input name="name" required autocomplete="name"></label><br><br><label>Телефон<br><input name="phone" type="tel" required autocomplete="tel"></label><br><br><label>Адрес доставки<br><input name="address" required autocomplete="street-address"></label><br><br><button class="primary">Продолжить</button><p class="muted">Учебный пример: заказ не отправится, оплата не проводится.</p></form></dialog><div id="site-footer"></div><script src="app.js"></script><script>document.querySelector('#checkout-form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#checkout-dialog').close();alert('Это демонстрационный сайт: заказ не отправлен.');});</script></body></html>
